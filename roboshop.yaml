- name: create ec2 and r53 records
  hosts: all
  connection: local
  vars:
    sg_id: sg-0eecd105120308fa3
    image_id: ami-0055977a6e828a4f4
    env: dev 
    instances:
      - mongodb
      - catalogue
  tasks:
   - name: install ec2 instances
     amazon.aws.ec2_instance:
       instance_type: t3.micro
       security_group: "{{ sg_id }}"
       image_id: "{{ image_id}}"
       name: "{{ item }}-{{ env }}"
       tags: 
         Project: roboshop
         Environment: "{{ env }}"
         Name: "{{ item }}-{{ env }}"
     loop: "{{ instances }}"
     register: ec2_output

   - name: print ec2_output
     ansible.builtin.debug:
        msg: "{{ ec2_output }}"

